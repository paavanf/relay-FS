<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Relay builds staff rosters around qualifications, availability and rest limits, and says exactly why when a shift cannot be filled."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- The card a shared link shows in chat apps and social sites. The
         picture is a real screenshot of the demo (public/og-image.png, 1200x630,
         the size these cards use). Crawlers need full addresses, so these name
         the live site. Checked by src/app/socialPreview.test.js. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://relay-fs.vercel.app/" />
    <meta property="og:title" content="Rosters that follow your rules - Relay" />
    <meta
      property="og:description"
      content="Relay builds staff rosters around qualifications, availability and rest limits, and says exactly why when a shift cannot be filled."
    />
    <meta property="og:image" content="https://relay-fs.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Relay's Swaps page: a three-person swap chain in which Dara takes Elif's day shift, Elif takes Femi's night shift and Femi takes Dara's."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Tells the browser we support both, so native controls, form widgets
         and scrollbars are drawn to match instead of always light. -->
    <meta name="color-scheme" content="light dark" />
    <!-- Kept in sync with the resolved theme by themeStorage.applyTheme. -->
    <meta name="theme-color" content="#edf1f2" />

    <!-- Relay serves its own fonts (src/assets/fonts). The two every first
         screen shows - Inter for text, Archivo for headings - are fetched at
         once, before the stylesheet asks for them; the build swaps in their
         hashed addresses. Geist Mono, for times, loads when a page uses it. -->
    <link rel="preload" href="/src/assets/fonts/inter/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/archivo/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Apply the theme before first paint, so a dark-theme user never sees a
         flash of the light page. This runs before React mounts and must stay
         in step with src/features/theme/themeStorage.js - same storage key,
         same three states, same fallback. -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('relay-theme');
          // Anything other than an explicit choice means "follow the OS",
          // which is also what a first-time visitor gets.
          if (saved === 'light' || saved === 'dark') {
            theme = saved;
          } else {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
        } catch (e) {
          // Storage unavailable: fall back to light rather than failing.
        }
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#132023' : '#edf1f2');
      })();
    </script>

    <title>Rosters that follow your rules - Relay</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
