<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Relay builds staff rosters around qualifications, availability and rest limits, and says exactly why when a shift cannot be filled."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Tells the browser we support both, so native controls, form widgets
         and scrollbars are drawn to match instead of always light. -->
    <meta name="color-scheme" content="light dark" />
    <!-- Kept in sync with the resolved theme by themeStorage.applyTheme. -->
    <meta name="theme-color" content="#edf1f2" />

    <!-- Archivo for headings and figures (its width axis is used), Inter for
         UI text, Geist Mono for times and hours. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Archivo:wdth,wght@100..125,500..800&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the theme before first paint, so a dark-theme user never sees a
         flash of the light page. This runs before React mounts and must stay
         in step with src/features/theme/themeStorage.js - same storage key,
         same three states, same fallback. -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('relay-theme');
          // Anything other than an explicit choice means "follow the OS",
          // which is also what a first-time visitor gets.
          if (saved === 'light' || saved === 'dark') {
            theme = saved;
          } else {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
        } catch (e) {
          // Storage unavailable: fall back to light rather than failing.
        }
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#132023' : '#edf1f2');
      })();
    </script>

    <title>Rosters that follow your rules - Relay</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
